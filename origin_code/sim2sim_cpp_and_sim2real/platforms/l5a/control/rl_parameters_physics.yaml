# IsaacLab Huilun-L5A-WF-Flat Sim2Real deployment parameters.
# The external standMode_step caller remains 0.002 s; decimation 10 gives a nominal 50 Hz policy request rate.

control:
  # PD控制器参数:
  pd_controller:
    kp: [84.0, 84.0, 84.0, 0.0, 84.0, 84.0, 84.0, 0.0]
    kd: [2.5, 2.5, 2.5, 0.8, 2.5, 2.5, 2.5, 0.8]

  pos_fb_controller:
    kp: [84.0, 84.0, 84.0, 0.0, 84.0, 84.0, 84.0, 0.0]
    kd: [2.5, 2.5, 2.5, 0.8, 2.5, 2.5, 2.5, 0.8]

  action_scales:
    # 位置动作的缩放系数
    pos: 0.25
    # 速度动作的缩放系数
    vel: 0.5

  decimation: 10

  EDamping:
    edamp_hip: 2.0
    edamp_knee: 2.0
    edamp_wheel: 2.0

obs_scales:
  ang_vel: 0.25
  gravity: 1.0
  dof_pos: 1.0
  dof_vel: 0.05
  last_action: 1.0

clip_obs: 100.0
clip_actions: 100.0

# [left leg, left wheel, right leg, right wheel]
default_pos: [0.0523599, 0.261799, -0.560251, 0.0, -0.0523599, 0.261799, -0.560251, 0.0]

# 速度与角速度补偿Physical command compensation. The current values preserve the legacy zero compensation.
lin_vel_x_com: 0.0
lin_vel_y_com: 0.0
omega_com: 0.0

model:
  estimator: "velocity_estimator.pt"
  controller: "policy.pt"
  proprioception_dim: 28
  history_length: 10
  estimated_velocity_dim: 3
  command_dim: 3
  action_dim: 8
