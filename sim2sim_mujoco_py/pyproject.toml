[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-sim2sim"
version = "0.2.0"
description = "Generic single-process MuJoCo runner for split Encoder and Actor policies"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mujoco==3.9.0",
  "numpy>=1.26,<3",
  "onnxruntime==1.26.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["model", "observation", "control", "simulator"]
